    /* ===== Contact Card Styling ===== */
    .contact-card-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 60vh;
      padding: 2rem;
    }

    .contact-card {
      background: #fff;
      border: 2px solid var(--color-black);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 8px 8px 0 var(--color-black);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .contact-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 12px 12px 0 var(--color-black);
    }

    .contact-card .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--color-primary);
      margin: 0 auto 1.5rem;
      display: block;
    }

    .contact-card h2 {
      font-family: var(--font-secondary);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--color-black);
      margin-bottom: 0.25rem;
    }

    .contact-card .role-tag {
      font-family: var(--font-primary);
      font-size: 0.85rem;
      color: var(--color-primary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2rem;
    }

    .contact-card .info-line {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border: 1px dashed var(--color-black);
      border-radius: 8px;
      margin-bottom: 0.75rem;
      font-family: var(--font-primary);
      font-size: 0.95rem;
      color: var(--color-black);
      transition: background 0.2s;
      text-decoration: none;
    }

    .contact-card .info-line:hover {
      background: var(--color-primary-transparent);
    }

    .contact-card .info-line svg {
      flex-shrink: 0;
    }

    .contact-card .info-line a {
      color: var(--color-black);
      text-decoration: none;
      font-family: var(--font-primary);
    }

    .contact-divider {
      border: none;
      border-top: 2px dashed var(--color-black);
      margin: 1.75rem 0;
      opacity: 0.4;
    }

    .contact-card .social-row {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
    }

    .contact-card .social-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--color-black);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      background: #fff;
    }

    .contact-card .social-icon:hover {
      background: var(--color-primary);
      border-color: var(--color-primary);
      transform: translateY(-3px);
      box-shadow: 0 6px 0 var(--color-black);
    }

    .contact-card .social-icon:hover svg {
      fill: #fff;
    }

    .contact-card .social-icon svg {
      transition: fill 0.25s;
    }

    @media (max-width: 480px) {
      .contact-card {
        padding: 2rem 1.5rem;
        box-shadow: 5px 5px 0 var(--color-black);
      }
      .contact-card:hover {
        box-shadow: 8px 8px 0 var(--color-black);
      }
    }
  </style>
